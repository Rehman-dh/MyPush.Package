name: my_push
description: Self-hosted push notification SDK (OneSignal alternative) using FCM.
version: 0.3.1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Ranges rather than carets: a host app on the Firebase 4.x / BoM-matched set
  # could not resolve against ^3.6.0 at all. firebase_messaging's own pubspec
  # pins the matching firebase_core, so pub still picks a consistent pair.
  firebase_core: ">=3.6.0 <5.0.0"
  firebase_messaging: ">=15.1.3 <17.0.0"
  # Floor is 20.0.0, not 17.x: that release turned the positional parameters of
  # initialize()/show() into named ones, and this package now calls the named
  # form. 17-19 would compile-error, so they are excluded on purpose.
  flutter_local_notifications: ">=20.0.0 <23.0.0"
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
